name: ai-meeting

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: ai-meeting-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Unit tests
        run: python -m unittest discover -s runner/tests/unit -v
      - name: Integration tests
        run: python -m unittest discover -s runner/tests/integration -v
      - name: Protocol validation
        run: python -m runner.validate

  auto-run:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ secrets.GPT_API_KEY != '' || secrets.DOUBAO_API_KEY != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run one AI turn
        env:
          OPENAI_API_KEY: ${{ secrets.GPT_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          DOUBAO_MODEL: ${{ vars.DOUBAO_MODEL }}
        run: python -m runner.main --once
